<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="wandorius — blog, portfolio y proyectos" />
  <meta name="theme-color" content="#ffffff" />
  <title>wandorius</title>
  <!-- Preconnect para Google Fonts — se carga dinámicamente desde settings -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>W</text></svg>" />
  <!-- [297A-18] Anti-flash de tema: aplica data-tema antes de la primera pintura.
       Fuente de verdad es theme-store (frontend/src/features/runtime/theme-store.ts);
       este bloque solo evita el parpadeo. Sin almacenamiento cae a claro. -->
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('wandorius:tema');
        var oscuro = tema === 'oscuro' || (tema !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.setAttribute('data-tema', 'oscuro');
      } catch (e) { /* sin almacenamiento: tema claro por defecto */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
